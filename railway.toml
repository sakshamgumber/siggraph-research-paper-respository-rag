[build]
builder = "dockerfile"
dockerfilePath = "rag-research/Dockerfile"
buildContext = "rag-research"

[deploy]
startCommand = "uvicorn api.main:app --host 0.0.0.0 --port ${PORT:-8000} --workers 2"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
